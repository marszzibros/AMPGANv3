[project]
name = "ampganv3"
version = "3.0.0"
description = "Agentic Discovery of Non-Canonical Antimicrobial Peptides with AMPGAN v3"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # core numerics / data
    "numpy>=1.26,<3",
    "pandas>=2.0",
    # training stack
    "torch>=2.5",
    "lightning>=2.4",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.18",
    # pepcraft agent stack
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "anyio>=4.4",
    # verification / structure tooling
    "biopython>=1.83",
    "requests>=2.31",
]

[project.optional-dependencies]
# Structure prediction (pepcraft/tools/Generating/Predict_Structure.py) shells out
# to the `simplefold` CLI. Install separately from https://github.com/apple/ml-simplefold
structure = []

[tool.uv]
# CUDA 12.6 wheels for the local RTX 4080 (driver 560.x).
# Swap to the cpu index if you are on a machine without an NVIDIA GPU.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
